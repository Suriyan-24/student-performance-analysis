<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Performance Analysis</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:24px;background:linear-gradient(160deg,#eaf1ff,#f8fafc 55%,#fff);min-height:100vh}.wrap{max-width:960px;margin:auto}.hero{padding:24px 0}.eyebrow{color:#315ed7;font-weight:800;letter-spacing:.12em;font-size:12px}h1{font-size:clamp(30px,5vw,44px);margin:8px 0}.muted{color:#64748b}.panel{background:#fff;border:1px solid #dce4f0;border-radius:18px;padding:24px;box-shadow:0 12px 32px #24385b0b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.field small{color:#64748b}button{margin-top:20px;border:0;border-radius:10px;background:#2455d6;color:white;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer}.result{display:none;margin-top:20px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #e2e8f0;padding:12px 0;gap:16px}.score{font-size:42px;font-weight:850;color:#2455d6}.tag{display:inline-block;background:#e8efff;color:#214ab5;border-radius:999px;padding:5px 10px;font-weight:700}.suggestions li{margin:8px 0}@media(max-width:600px){body{padding:14px}.grid{grid-template-columns:1fr}.panel{padding:18px}}
</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">LEARNER INSIGHTS</div><h1>Student Performance Analysis</h1><p class="muted">Enter the eight metrics to estimate a weighted score and get practical suggestions. This is an educational heuristic, not a clinical or official academic assessment.</p></header>
<form id="form" class="panel"><div class="grid">
<div class="field"><label for="iq">IQ (90–140)</label><input id="iq" type="number" min="0" max="200" value="110" required></div>
<div class="field"><label for="attention">Attention span (1–10)</label><input id="attention" type="number" min="1" max="10" value="7" required></div>
<div class="field"><label for="attendance">Attendance (%)</label><input id="attendance" type="number" min="0" max="100" value="85" required></div>
<div class="field"><label for="study">Study hours / week</label><input id="study" type="number" min="0" max="168" value="18" required></div>
<div class="field"><label for="extra">Extracurricular hours / week</label><input id="extra" type="number" min="0" max="168" value="3" required></div>
<div class="field"><label for="games">Strategic games hours / week</label><input id="games" type="number" min="0" max="168" value="2" required></div>
<div class="field"><label for="sports">Sports hours / week</label><input id="sports" type="number" min="0" max="168" value="3" required></div>
<div class="field"><label for="leisure">Leisure hours / week</label><input id="leisure" type="number" min="0" max="168" value="8" required></div>
</div><button type="submit">Analyze performance</button></form>
<section id="result" class="panel result" aria-live="polite"><div class="eyebrow">YOUR SUMMARY</div><div class="score" id="score"></div><div id="grade" class="tag"></div><h2 id="category"></h2><div id="metrics"></div><h3>Suggestions</h3><ul id="suggestions" class="suggestions"></ul></section>
<script>
const $=id=>document.getElementById(id);function grade(s){return s>=90?'A+':s>=80?'A':s>=70?'B+':s>=60?'B':s>=50?'C':'D'}function category(s){return s>=90?'All-round Achiever':s>=80?'Creative Performer':s>=70?'Hardworking Student':s>=60?'Average Learner':'Needs Guidance'}
$('form').addEventListener('submit',e=>{e.preventDefault();const v={iq:+$('iq').value,attention:+$('attention').value,attendance:+$('attendance').value,study:+$('study').value,extra:+$('extra').value,games:+$('games').value,sports:+$('sports').value,leisure:+$('leisure').value};if(v.attention<1||v.attention>10||v.attendance<0||v.attendance>100||v.iq<0||v.iq>200){alert('Check the valid ranges and try again.');return}
const inputs=[v.iq,v.attention*10,v.attendance,v.study*4,v.extra*10,v.games*10,v.sports*10,v.leisure*10],w=[.25,.20,.15,.15,.05,.05,.10,.05];const s=Math.round(inputs.reduce((n,x,i)=>n+x*w[i],0)*100)/100;
$('score').textContent=s+' / 100';$('grade').textContent='Grade '+grade(s);$('category').textContent=category(s);$('metrics').innerHTML='';for(const [k,label] of [['iq','IQ'],['attention','Attention span'],['attendance','Attendance'],['study','Study hours/week'],['extra','Extracurricular hours/week'],['games','Strategic games hours/week'],['sports','Sports hours/week'],['leisure','Leisure hours/week']]){const row=document.createElement('div');row.className='metric';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=label;b.textContent=v[k];row.append(a,b);$('metrics').append(row)}
const tips=[];if(v.iq<100)tips.push('Try varied reasoning puzzles and problem-solving exercises.');if(v.attention<6)tips.push('Use focused study blocks and short breaks to build attention.');if(v.attendance<75)tips.push('Improve class attendance and catch up on missed lessons.');if(v.study<15)tips.push('Increase consistent weekly study time.');if(v.extra<2)tips.push('Try an extracurricular activity to build creativity and collaboration.');if(v.games<1)tips.push('Try a strategy game such as chess for structured problem-solving.');if(v.sports<1)tips.push('Add regular physical activity to your weekly routine.');if(v.leisure>8)tips.push('Review your weekly schedule and balance leisure with other priorities.');if(!tips.length)tips.push('Your entered metrics look balanced. Keep reviewing your progress over time.');$('suggestions').innerHTML='';tips.forEach(t=>{const li=document.createElement('li');li.textContent=t;$('suggestions').append(li)});$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth',block:'start'})});
</script></main></body></html>
